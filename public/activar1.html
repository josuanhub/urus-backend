<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Alertas URUS</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #94a3b8; margin-bottom: 24px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 12px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #2563eb; }
        .mensaje { margin-top: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔔 Activa tus Alertas URUS</h1>
        <p>Recibe oportunidades de construcción en tiempo real directamente en tu WhatsApp.</p>
        <input type="text" id="whatsapp" placeholder="Tu número de WhatsApp (ej: 17871234567)" />
        <button onclick="activar()">Activar Alertas</button>
        <div class="mensaje" id="mensaje"></div>
    </div>

    <script>
        async function activar() {
            const numero = document.getElementById('whatsapp').value.trim();
            const mensaje = document.getElementById('mensaje');
            
            if (!numero) {
                mensaje.style.color = '#ef4444';
                mensaje.textContent = 'Por favor ingresa tu número.';
                return;
            }

            mensaje.textContent = 'Activando...';
            mensaje.style.color = '#94a3b8';

            try {
                const res = await fetch('/api/radar/activar-alerta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ whatsapp: numero })
                });

                const data = await res.json();

                if (res.ok) {
                    mensaje.style.color = '#22c55e';
                    mensaje.textContent = '✅ ¡Alerta activada! Revisa tu WhatsApp en unos minutos.';
                } else {
                    mensaje.style.color = '#ef4444';
                    mensaje.textContent = 'Error: ' + (data.error || 'Intenta de nuevo.');
                }
            } catch (e) {
                mensaje.style.color = '#ef4444';
                mensaje.textContent = 'Error de conexión. Intenta de nuevo.';
            }
        }
    </script>
</body>
</html>
