<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JARVIS — URUS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #08080f;
    color: #e8e6f0;
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px;
    background: #0f0f1a;
    border-right: 1px solid #1e1e2e;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    gap: 8px;
    flex-shrink: 0;
  }

  .logo {
    font-size: 20px;
    font-weight: 700;
    color: #c8a84b;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    padding: 0 8px;
  }

  .status {
    font-size: 11px;
    color: #3ecf6a;
    padding: 0 8px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #3ecf6a;
    border-radius: 50%;
    display: inline-block;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: #8888aa;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    width: 100%;
  }

  .nav-btn:hover { background: #1a1a2e; color: #e8e6f0; }
  .nav-btn.active { background: #1a1a2e; color: #c8a84b; }

  /* ── MAIN ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    padding: 16px 24px;
    border-bottom: 1px solid #1e1e2e;
    font-size: 13px;
    color: #5555770;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar-title {
    font-size: 14px;
    font-weight: 600;
    color: #c8a84b;
  }

  /* ── PANELS ── */
  .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .panel.active { display: flex; }

  /* ── CHAT ── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .msg.user {
    background: #1a1a2e;
    border: 1px solid #2a2a45;
    align-self: flex-end;
    color: #c8c8e8;
  }

  .msg.jarvis {
    background: #110f1a;
    border: 1px solid #c8a84b33;
    align-self: flex-start;
    color: #e8e6f0;
    border-left: 2px solid #c8a84b;
  }

  .msg.system {
    background: transparent;
    color: #555577;
    font-size: 12px;
    align-self: center;
    font-style: italic;
  }

  .chat-input-area {
    padding: 16px 24px;
    border-top: 1px solid #1e1e2e;
    display: flex;
    gap: 10px;
  }

  .chat-input {
    flex: 1;
    background: #0f0f1a;
    border: 1px solid #2a2a45;
    border-radius: 10px;
    padding: 12px 16px;
    color: #e8e6f0;
    font-size: 14px;
    outline: none;
    resize: none;
    font-family: inherit;
    line-height: 1.5;
  }

  .chat-input:focus { border-color: #c8a84b55; }

  .send-btn {
    background: #c8a84b;
    border: none;
    color: #08080f;
    font-weight: 700;
    font-size: 13px;
    padding: 0 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── MORNING / STRATEGOS PANELS ── */
  .content-panel {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-title {
    font-size: 20px;
    font-weight: 700;
    color: #c8a84b;
    margin-bottom: 8px;
  }

  .panel-sub {
    font-size: 13px;
    color: #555577;
    margin-bottom: 24px;
  }

  .big-btn {
    background: #c8a84b;
    border: none;
    color: #08080f;
    font-weight: 700;
    font-size: 14px;
    padding: 14px 28px;
    border-radius: 10px;
    cursor: pointer;
    width: fit-content;
    transition: opacity 0.15s;
  }

  .big-btn:hover { opacity: 0.85; }
  .big-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .result-box {
    background: #0f0f1a;
    border: 1px solid #c8a84b33;
    border-left: 2px solid #c8a84b;
    border-radius: 10px;
    padding: 20px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: #e8e6f0;
    display: none;
  }

  .strat-input {
    background: #0f0f1a;
    border: 1px solid #2a2a45;
    border-radius: 10px;
    padding: 14px 16px;
    color: #e8e6f0;
    font-size: 14px;
    outline: none;
    resize: vertical;
    font-family: inherit;
    line-height: 1.5;
    width: 100%;
    min-height: 100px;
  }

  .strat-input:focus { border-color: #c8a84b55; }

  /* ── MEMORY PANEL ── */
  .memory-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .memory-item {
    background: #0f0f1a;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.5;
  }

  .memory-item .mem-type {
    font-size: 10px;
    color: #c8a84b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .memory-item .mem-content {
    color: #8888aa;
    white-space: pre-wrap;
    max-height: 80px;
    overflow: hidden;
  }

  .memory-item .mem-date {
    font-size: 10px;
    color: #333355;
    margin-top: 6px;
  }

  /* ── LOADER ── */
  .typing {
    display: none;
    align-self: flex-start;
    padding: 12px 16px;
    background: #110f1a;
    border: 1px solid #c8a84b33;
    border-left: 2px solid #c8a84b;
    border-radius: 12px;
    color: #c8a84b;
    font-size: 13px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a45; border-radius: 2px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">JARVIS</div>
  <div class="status">ACTIVO</div>

  <button class="nav-btn active" onclick="showPanel('chat')">💬 Chat</button>
  <button class="nav-btn" onclick="showPanel('morning')">🌅 Morning Scan</button>
  <button class="nav-btn" onclick="showPanel('strategos')">⚔️ Strategos</button>
  <button class="nav-btn" onclick="showPanel('memory')">🧠 Memoria</button>
</aside>

<main class="main">

  <div class="topbar">
    <span class="topbar-title" id="panel-label">Chat</span>
    <span style="font-size:12px;color:#333355">urus-backend · Railway</span>
  </div>

  <!-- CHAT -->
  <div class="panel active" id="panel-chat">
    <div class="chat-messages" id="chat-messages">
      <div class="msg system">Jarvis está listo. Habla.</div>
    </div>
    <div class="typing" id="typing">Jarvis está pensando...</div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chat-input" rows="2"
        placeholder="Escríbele a Jarvis..."
        onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <!-- MORNING -->
  <div class="panel" id="panel-morning">
    <div class="content-panel">
      <div class="panel-title">Morning Scan</div>
      <div class="panel-sub">Jarvis escanea tu estado y te da dirección para el día.</div>
      <button class="big-btn" id="morning-btn" onclick="runMorning()">Activar escaneo</button>
      <div class="result-box" id="morning-result"></div>
    </div>
  </div>

  <!-- STRATEGOS -->
  <div class="panel" id="panel-strategos">
    <div class="content-panel">
      <div class="panel-title">Strategos</div>
      <div class="panel-sub">Descríbele una situación. Jarvis te da las jugadas.</div>
      <textarea class="strat-input" id="strat-input"
        placeholder="Ej: Tengo un socio con recursos, quiero posicionarme antes de que me absorba..."></textarea>
      <button class="big-btn" id="strat-btn" onclick="runStrategos()">Analizar</button>
      <div class="result-box" id="strat-result"></div>
    </div>
  </div>

  <!-- MEMORY -->
  <div class="panel" id="panel-memory">
    <div class="content-panel">
      <div class="panel-title">Memoria</div>
      <div class="panel-sub">Lo que Jarvis recuerda de ti.</div>
      <button class="big-btn" onclick="loadMemory()">Cargar memoria</button>
      <div class="memory-list" id="memory-list"></div>
    </div>
  </div>

</main>

<script>
const BASE = "";  // mismo dominio

// ── Panel navigation
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.target.classList.add('active');
  const labels = { chat: 'Chat', morning: 'Morning Scan', strategos: 'Strategos', memory: 'Memoria' };
  document.getElementById('panel-label').textContent = labels[name];
}

// ── Chat
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, 'user');
  input.value = '';
  setLoading(true);

  try {
    const res = await fetch('/v1/jarvis/strategos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: text })
    });
    const data = await res.json();
    const reply = data.output || data.reply || data.strategy || 'Sin respuesta.';
    addMsg(reply, 'jarvis');
  } catch (e) {
    addMsg('Error al conectar con Jarvis.', 'system');
  }
  setLoading(false);
}

function addMsg(text, type) {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function setLoading(on) {
  document.getElementById('typing').style.display = on ? 'block' : 'none';
  document.getElementById('send-btn').disabled = on;
  const box = document.getElementById('chat-messages');
  if (on) box.scrollTop = box.scrollHeight;
}

// ── Morning
async function runMorning() {
  const btn = document.getElementById('morning-btn');
  const box = document.getElementById('morning-result');
  btn.disabled = true;
  btn.textContent = 'Escaneando...';
  box.style.display = 'none';

  try {
    const res = await fetch('/v1/jarvis/morning', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    const data = await res.json();
    box.textContent = data.output || data.scan || 'Sin respuesta.';
    box.style.display = 'block';
  } catch (e) {
    box.textContent = 'Error al conectar.';
    box.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = 'Activar escaneo';
}

// ── Strategos
async function runStrategos() {
  const input = document.getElementById('strat-input').value.trim();
  if (!input) return;
  const btn = document.getElementById('strat-btn');
  const box = document.getElementById('strat-result');
  btn.disabled = true;
  btn.textContent = 'Analizando...';
  box.style.display = 'none';

  try {
    const res = await fetch('/v1/jarvis/strategos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input })
    });
    const data = await res.json();
    box.textContent = data.output || data.reply || data.strategy || 'Sin respuesta.';
    box.style.display = 'block';
  } catch (e) {
    box.textContent = 'Error al conectar.';
    box.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = 'Analizar';
}

// ── Memory
async function loadMemory() {
  const list = document.getElementById('memory-list');
  list.innerHTML = '<div class="msg system">Cargando...</div>';

  try {
    const res = await fetch('/v1/jarvis/recall', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limit: 20 })
    });
    const data = await res.json();
    const items = data.memory || data.entries || [];

    if (!items.length) {
      list.innerHTML = '<div class="msg system">Sin memoria aún.</div>';
      return;
    }

    list.innerHTML = items.map(m => `
      <div class="memory-item">
        <div class="mem-type">${m.type || 'note'}</div>
        <div class="mem-content">${m.content || ''}</div>
        <div class="mem-date">${m.created_at ? new Date(m.created_at).toLocaleString('es') : ''}</div>
      </div>
    `).join('');
  } catch (e) {
    list.innerHTML = '<div class="msg system">Error al cargar.</div>';
  }
}
</script>
</body>
</html>
