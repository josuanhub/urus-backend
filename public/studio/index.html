<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URUS Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 20px;
  }

  #login-screen h1 {
    color: #c9a84c;
    font-size: 2rem;
    letter-spacing: 4px;
  }

  #login-screen p {
    color: #666;
    font-size: 0.8rem;
  }

  #login-screen input {
    background: #111;
    border: 1px solid #c9a84c;
    color: #fff;
    padding: 12px 20px;
    font-size: 1rem;
    font-family: 'Courier New', monospace;
    width: 280px;
    text-align: center;
    outline: none;
  }

  #login-screen button {
    background: #c9a84c;
    color: #000;
    border: none;
    padding: 12px 40px;
    font-size: 0.9rem;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 2px;
  }

  #login-screen button:hover { background: #e0c068; }

  #app { display: none; flex-direction: column; height: 100vh; }

  #header {
    background: #111;
    border-bottom: 1px solid #c9a84c33;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #header h1 { color: #c9a84c; font-size: 1rem; letter-spacing: 3px; }
  #header span { color: #444; font-size: 0.7rem; }

  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  #sidebar {
    width: 200px;
    background: #0d0d0d;
    border-right: 1px solid #1a1a1a;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #sidebar h3 {
    color: #444;
    font-size: 0.65rem;
    letter-spacing: 2px;
    padding: 0 16px 12px;
  }

  .project-btn {
    background: none;
    border: none;
    color: #666;
    padding: 10px 16px;
    text-align: left;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    transition: all 0.2s;
    border-left: 2px solid transparent;
  }

  .project-btn:hover { color: #c9a84c; background: #111; }
  .project-btn.active { color: #c9a84c; border-left-color: #c9a84c; background: #111; }

  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #project-label {
    padding: 10px 20px;
    background: #0d0d0d;
    border-bottom: 1px solid #1a1a1a;
    color: #c9a84c;
    font-size: 0.7rem;
    letter-spacing: 2px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: #0a0a0a; }
  #messages::-webkit-scrollbar-thumb { background: #333; }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 85%;
  }

  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }

  .msg-label {
    font-size: 0.6rem;
    color: #444;
    letter-spacing: 1px;
  }

  .msg.user .msg-label { text-align: right; color: #c9a84c88; }

  .msg-content {
    padding: 12px 16px;
    font-size: 0.82rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .msg-content {
    background: #1a1500;
    border: 1px solid #c9a84c33;
    color: #e0e0e0;
  }

  .msg.assistant .msg-content {
    background: #111;
    border: 1px solid #1a1a1a;
    color: #d0d0d0;
  }

  .msg-content code {
    background: #0a0a0a;
    color: #c9a84c;
    padding: 2px 6px;
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
  }

  .msg-content pre {
    background: #050505;
    border: 1px solid #1a1a1a;
    padding: 12px;
    margin: 8px 0;
    overflow-x: auto;
    font-size: 0.75rem;
    line-height: 1.5;
  }

  #typing {
    display: none;
    padding: 0 20px;
    color: #c9a84c;
    font-size: 0.7rem;
    letter-spacing: 2px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

  #input-area {
    padding: 16px 20px;
    background: #0d0d0d;
    border-top: 1px solid #1a1a1a;
    display: flex;
    gap: 10px;
  }

  #input {
    flex: 1;
    background: #111;
    border: 1px solid #2a2a2a;
    color: #e0e0e0;
    padding: 12px 16px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    outline: none;
    resize: none;
    height: 48px;
    max-height: 200px;
    overflow-y: auto;
    transition: border 0.2s;
  }

  #input:focus { border-color: #c9a84c55; }

  #send-btn {
    background: #c9a84c;
    color: #000;
    border: none;
    padding: 0 20px;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.2s;
  }

  #send-btn:hover { background: #e0c068; }
  #send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

  #clear-btn {
    background: none;
    border: 1px solid #1a1a1a;
    color: #444;
    padding: 0 12px;
    cursor: pointer;
    font-size: 0.7rem;
    font-family: 'Courier New', monospace;
    transition: all 0.2s;
  }

  #clear-btn:hover { border-color: #333; color: #666; }

  .welcome {
    color: #333;
    font-size: 0.8rem;
    text-align: center;
    margin: auto;
    line-height: 2;
  }

  .welcome span { color: #c9a84c; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>⬡ URUS</h1>
  <p>STUDIO — ACCESO RESTRINGIDO</p>
  <input type="password" id="pwd-input" placeholder="contraseña" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">ENTRAR</button>
</div>

<div id="app">
  <div id="header">
    <h1>⬡ URUS STUDIO</h1>
    <span id="project-tag">GENERAL</span>
  </div>

  <div id="main">
    <div id="sidebar">
      <h3>PROYECTOS</h3>
      <button class="project-btn active" onclick="setProject('GENERAL')">⬡ General</button>
      <button class="project-btn" onclick="setProject('DEALERFLOW')">◈ DealerFlow</button>
      <button class="project-btn" onclick="setProject('JARVIS')">◉ JARVIS</button>
      <button class="project-btn" onclick="setProject('GOVTECH')">◫ GovTech</button>
      <button class="project-btn" onclick="setProject('URUS CORE')">◎ URUS Core</button>
    </div>

    <div id="chat-area">
      <div id="project-label">MODO: <span id="mode-label">GENERAL</span></div>
      <div id="messages">
        <div class="welcome">
          <span>⬡ URUS STUDIO</span><br>
          Sistema operativo de inteligencia activo.<br>
          Contexto cargado. Selecciona un proyecto y ejecuta.
        </div>
      </div>
      <div id="typing">procesando...</div>
      <div id="input-area">
        <textarea id="input" placeholder="Escribe tu instrucción..." onkeydown="handleKey(event)"></textarea>
        <button id="clear-btn" onclick="clearChat()">LIMPIAR</button>
        <button id="send-btn" onclick="sendMessage()">ENVIAR</button>
      </div>
    </div>
  </div>
</div>

<script>
  let password = '';
  let currentProject = 'GENERAL';
  let history = [];

  const projectContexts = {
    'GENERAL': 'Contexto general URUS. Responde cualquier consulta técnica o estratégica.',
    'DEALERFLOW': 'Proyecto DealerFlow. CRM para dealers de autos en Puerto Rico. Cliente activo: Iván Auto Imports. Auth: x-dealer-key ivan2026. Endpoints en /v1/dealer/. WhatsApp via Twilio a 787-390-5016.',
    'JARVIS': 'Proyecto JARVIS. IA personal de Josuan. Frontend: public/jarvis/jarvis.html. Motor: Groq/Llama primario. OpenAI solo para embeddings. Respuestas en español. TTS activo.',
    'GOVTECH': 'Proyecto GovTech. Inteligencia municipal Puerto Rico. Contacto estratégico: Jeremy. Target: Municipality of Arecibo. Modelo Palantir adaptado.',
    'URUS CORE': 'Proyecto URUS Core / URUS Console. Factoría de software autónoma multitenant. Generación dinámica de estructuras de base de datos y endpoints universales.'
  };

  function login() {
    const pwd = document.getElementById('pwd-input').value;
    if (pwd === 'urus2026') {
      password = pwd;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    } else {
      document.getElementById('pwd-input').style.borderColor = '#ff4444';
      setTimeout(() => document.getElementById('pwd-input').style.borderColor = '#c9a84c', 1000);
    }
  }

  function setProject(name) {
    currentProject = name;
    document.getElementById('project-tag').textContent = name;
    document.getElementById('mode-label').textContent = name;
    document.querySelectorAll('.project-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    history = [];
    const msgs = document.getElementById('messages');
    msgs.innerHTML = `<div class="welcome"><span>◈ ${name}</span><br>Contexto cargado. Ejecuta.</div>`;
  }

  function clearChat() {
    history = [];
    const msgs = document.getElementById('messages');
    msgs.innerHTML = `<div class="welcome"><span>⬡ URUS STUDIO</span><br>Chat limpiado. Contexto de proyecto mantenido.</div>`;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function addMessage(role, content) {
    const msgs = document.getElementById('messages');
    const welcomes = msgs.querySelectorAll('.welcome');
    welcomes.forEach(w => w.remove());

    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'TÚ' : 'URUS';

    const contentDiv = document.createElement('div');
    contentDiv.className = 'msg-content';
    contentDiv.textContent = content;

    div.appendChild(label);
    div.appendChild(contentDiv);
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    input.value = '';

    addMessage('user', text);

    const projectCtx = projectContexts[currentProject] || '';
    const fullMessage = `[PROYECTO: ${currentProject}] ${projectCtx}\n\n${text}`;

    history.push({ role: 'user', content: fullMessage });

    document.getElementById('typing').style.display = 'block';

    try {
      const res = await fetch('/api/studio/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-studio-password': password
        },
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json();

      if (data.reply) {
        history.push({ role: 'assistant', content: data.reply });
        addMessage('assistant', data.reply);
      } else {
        addMessage('assistant', 'Error: ' + (data.error || 'Sin respuesta'));
      }

    } catch (err) {
      addMessage('assistant', 'Error de conexión con URUS Core.');
    }

    document.getElementById('typing').style.display = 'none';
    btn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
