<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URUS Console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e2c06a;
    --gold-dim: rgba(201,168,76,0.15);
    --gold-border: rgba(201,168,76,0.3);
    --bg: #0a0a0b;
    --bg-card: #111114;
    --bg-card2: #16161a;
    --bg-hover: #1c1c22;
    --text: #f0f0f0;
    --text-muted: #7a7a8a;
    --text-dim: #4a4a5a;
    --green: #4caf79;
    --green-dim: rgba(76,175,121,0.15);
    --red: #e05c5c;
    --red-dim: rgba(224,92,92,0.15);
    --blue: #5c9ee0;
    --border: rgba(255,255,255,0.06);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.25); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(201,168,76,0.45); }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-rows: 64px 1fr;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* Hexágono SVG logo */
  .hex-logo {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 8px rgba(201,168,76,0.5));
  }

  .header-titles {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .header-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .header-sub {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--green-dim);
    border: 1px solid rgba(76,175,121,0.25);
    color: var(--green);
  }

  .status-pill.offline {
    background: var(--red-dim);
    border-color: rgba(224,92,92,0.25);
    color: var(--red);
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .time-display {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
    padding: 5px 10px;
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  /* ── MAIN ── */
  main {
    padding: 28px;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::before {
    content: '';
    display: block;
    width: 3px;
    height: 14px;
    background: var(--gold);
    border-radius: 2px;
  }

  /* ── METRICS GRID ── */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .metric-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 22px 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }

  .metric-card:hover {
    border-color: var(--gold-border);
    transform: translateY(-1px);
  }

  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .metric-card:hover::before { opacity: 1; }

  .metric-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .metric-icon {
    width: 14px;
    height: 14px;
    opacity: 0.7;
  }

  .metric-value {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 8px;
  }

  .metric-value.gold { color: var(--gold); }
  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }

  .metric-sub {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
  }

  .metric-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .badge-green {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(76,175,121,0.2);
  }

  .badge-gold {
    background: var(--gold-dim);
    color: var(--gold);
    border: 1px solid var(--gold-border);
  }

  .badge-red {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(224,92,92,0.2);
  }

  /* loading skeleton */
  .skeleton {
    background: linear-gradient(90deg, var(--bg-card2) 25%, var(--bg-hover) 50%, var(--bg-card2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    height: 28px;
    width: 80px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── CONTENT ROW ── */
  .content-row {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
  }

  /* ── CARD ── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
  }

  .card-body {
    padding: 0;
  }

  /* ── CHANGES LIST ── */
  .change-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: default;
  }

  .change-item:last-child { border-bottom: none; }
  .change-item:hover { background: var(--bg-hover); }

  .change-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--gold-dim);
    border: 1px solid var(--gold-border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .change-icon svg {
    width: 14px;
    height: 14px;
    color: var(--gold);
  }

  .change-info { flex: 1; min-width: 0; }

  .change-action {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .change-detail {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .change-time {
    font-size: 10px;
    color: var(--text-dim);
    flex-shrink: 0;
    white-space: nowrap;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 22px;
    color: var(--text-dim);
    gap: 10px;
    font-size: 12px;
  }

  .empty-state svg {
    width: 32px;
    height: 32px;
    opacity: 0.3;
  }

  /* ── ACTIONS PANEL ── */
  .actions-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
  }

  /* ── BUTTONS ── */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    text-decoration: none;
    width: 100%;
  }

  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold), #b8922f);
    color: #0a0a0b;
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(201,168,76,0.3);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: var(--bg-card2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: var(--bg-hover);
    border-color: var(--gold-border);
    color: var(--gold);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover {
    background: var(--bg-hover);
    color: var(--text);
  }

  .btn.loading {
    pointer-events: none;
    opacity: 0.7;
  }

  .btn.loading .btn-spinner {
    display: block !important;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .btn-spinner { display: none; }

  /* ── INFO ROWS ── */
  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--text-muted); }
  .info-value { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

  /* ── TOAST ── */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
  }

  .toast {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-radius: var(--radius-sm);
    background: var(--bg-card2);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    max-width: 320px;
    animation: slideIn 0.2s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .toast.success { border-color: rgba(76,175,121,0.4); }
  .toast.error { border-color: rgba(224,92,92,0.4); }
  .toast.info { border-color: var(--gold-border); }

  .toast-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .toast.success .toast-dot { background: var(--green); }
  .toast.error .toast-dot { background: var(--red); }
  .toast.info .toast-dot { background: var(--gold); }

  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ── REFRESH INDICATOR ── */
  .refresh-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--bg-card2);
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .refresh-btn:hover { color: var(--gold); border-color: var(--gold-border); }
  .refresh-btn svg { width: 13px; height: 13px; }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }

  /* ── RESPONSIVE ── */
  @media (max-width: 1100px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    .content-row { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    main { padding: 16px; }
    .metrics-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    header { padding: 0 16px; }
    .metric-value { font-size: 22px; }
    .header-sub { display: none; }
  }

  @media (max-width: 400px) {
    .metrics-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- ── HEADER ── -->
  <header>
    <div class="header-left">
      <!-- Hexágono dorado SVG -->
      <svg class="hex-logo" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e2c06a"/>
            <stop offset="100%" stop-color="#a87828"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- Hexágono exterior -->
        <polygon
          points="19,2 34,10.5 34,27.5 19,36 4,27.5 4,10.5"
          fill="none"
          stroke="url(#hexGrad)"
          stroke-width="1.5"
          filter="url(#glow)"
        />
        <!-- Hexágono interior relleno -->
        <polygon
          points="19,7 30,13.5 30,24.5 19,31 8,24.5 8,13.5"
          fill="url(#hexGrad)"
          opacity="0.15"
        />
        <!-- U centrada -->
        <text
          x="19" y="24"
          text-anchor="middle"
          font-family="Inter, sans-serif"
          font-size="13"
          font-weight="800"
          fill="url(#hexGrad)"
          letter-spacing="-0.5"
        >U</text>
      </svg>

      <div class="header-titles">
        <span class="header-title">URUS Console</span>
        <span class="header-sub">urusverify.com · Josuan Bayón</span>
      </div>
    </div>

    <div class="header-right">
      <span id="server-pill" class="status-pill">
        <span class="dot"></span>
        <span id="server-pill-text">Verificando…</span>
      </span>
      <span class="time-display" id="clock">--:--:--</span>
    </div>
  </header>

  <!-- ── MAIN ── -->
  <main>

    <!-- MÉTRICAS -->
    <section>
      <div class="section-header">
        <span class="section-title">Métricas del sistema</span>
        <button class="refresh-btn" id="refresh-metrics" title="Actualizar métricas">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2"/>
            <path d="M10.5 2l2.5 2.5L10.5 7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="metrics-grid">

        <!-- MRR -->
        <div class="metric-card">
          <div class="metric-label">
            <svg class="metric-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M8 1v14M11 3.5H6.5a2 2 0 0 0 0 4h3a2 2 0 0 1 0 4H4" stroke-linecap="round"/>
            </svg>
            MRR
          </div>
          <div class="metric-value gold">$300</div>
          <div class="metric-sub">
            <span class="metric-badge badge-gold">▲ activo</span>
          </div>
        </div>

        <!-- Clientes -->
        <div class="metric-card">
          <div class="metric-label">
            <svg class="metric-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="8" cy="5" r="3"/>
              <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round"/>
            </svg>
            Clientes
          </div>
          <div class="metric-value">1</div>
          <div class="metric-sub">
            <span class="metric-badge badge-green">● activo</span>
          </div>
        </div>

        <!-- Uptime -->
        <div class="metric-card">
          <div class="metric-label">
            <svg class="metric-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="8" cy="8" r="6"/>
              <path d="M8 4.5v3.5l2.5 2" stroke-linecap="round"/>
            </svg>
            Uptime
          </div>
          <div class="metric-value" id="uptime-value">
            <div class="skeleton"></div>
          </div>
          <div class="metric-sub" id="uptime-sub">Cargando…</div>
        </div>

        <!-- Servidor -->
        <div class="metric-card">
          <div class="metric-label">
            <svg class="metric-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="1" y="3" width="14" height="4" rx="1"/>
              <rect x="1" y="9" width="14" height="4" rx="1"/>
              <circle cx="3.5" cy="5" r="0.8" fill="currentColor"/>
              <circle cx="3.5" cy="11" r="0.8" fill="currentColor"/>
            </svg>
            Servidor
          </div>
          <div class="metric-value green" id="server-value">
            <div class="skeleton"></div>
          </div>
          <div class="metric-sub" id="server-sub">Verificando…</div>
        </div>

      </div>
    </section>

    <!-- CONTENT ROW -->
    <div class="content-row">

      <!-- ÚLTIMOS CAMBIOS -->
      <div class="card">
        <div class="card-header">
          <span class="section-title">Últimos cambios</span>
          <button class="refresh-btn" id="refresh-changes" title="Actualizar cambios">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2"/>
              <path d="M10.5 2l2.5 2.5L10.5 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="card-body" id="changes-list">
          <!-- Se rellena con JS -->
          <div class="empty-state">
            <div class="skeleton" style="width:180px;height:12px;margin-bottom:8px;"></div>
            <div class="skeleton" style="width:120px;height:12px;"></div>
          </div>
        </div>
      </div>

      <!-- PANEL DERECHO -->
      <div style="display:flex;flex-direction:column;gap:16px;">

        <!-- ACCIONES -->
        <div class="card">
          <div class="card-header">
            <span class="section-title">Acciones</span>
          </div>
          <div class="actions-panel">
            <a href="/studio" class="btn btn-primary" id="btn-studio">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="1" y="2" width="14" height="10" rx="1.5"/>
                <path d="M5 14h6M8 12v2" stroke-linecap="round"/>
              </svg>
              Abrir Studio
            </a>

            <button class="btn btn-secondary" id="btn-reindex">
              <svg class="btn-spinner" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="8" cy="8" r="6" stroke-dasharray="28" stroke-dashoffset="10"/>
              </svg>
              <svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2" stroke-linecap="round"/>
                <path d="M10.5 2l2.5 2.5L10.5 7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Reindexar
            </button>

            <button class="btn btn-ghost" id="btn-refresh-all">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M8 2a6 6 0 1 0 6 6" stroke-linecap="round"/>
                <path d="M12 1v3h-3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Actualizar todo
            </button>
          </div>
        </div>

        <!-- INFO SISTEMA -->
