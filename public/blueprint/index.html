<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>URUS Blueprint OS</title>

<style>
:root {
  --bg: #0b0b0f;
  --card: #111118;
  --gold: #d4af37;
  --text: #f5f5f5;
  --muted: #888;
}

body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  background: #0f0f14;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  padding: 20px;
}

.sidebar h2 {
  color: var(--gold);
}

.sidebar button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: var(--card);
  border: none;
  color: white;
  cursor: pointer;
}

/* MAIN */
.main {
  margin-left: 240px;
  padding: 20px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* BUTTON */
.btn-gold {
  background: var(--gold);
  color: black;
  border: none;
  padding: 10px 16px;
  cursor: pointer;
}

/* DASHBOARD */
.dashboard {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

/* LEADS LIST */
.leads {
  width: 35%;
  background: var(--card);
  border-radius: 10px;
  overflow-y: auto;
  max-height: 80vh;
}

.lead {
  padding: 15px;
  border-bottom: 1px solid #222;
  cursor: pointer;
}

.lead.active {
  background: #1a1a22;
}

.badge {
  background: red;
  border-radius: 50%;
  padding: 3px 8px;
  font-size: 12px;
}

/* CHAT */
.chat {
  flex: 1;
  background: var(--card);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
}

.messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.message {
  margin: 8px 0;
}

.bot {
  color: var(--gold);
}

.input-area {
  display: flex;
  padding: 10px;
}

input {
  flex: 1;
  padding: 10px;
  background: #0f0f14;
  border: none;
  color: white;
}

.typing {
  font-size: 12px;
  color: var(--muted);
}

/* MOBILE */
@media(max-width:768px){
  .sidebar {
    display:none;
  }

  .main {
    margin:0;
  }

  .dashboard {
    flex-direction: column;
  }

  .leads {
    width:100%;
    max-height: 200px;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>URUS OS</h2>
  <button onclick="showDashboard()">Dashboard</button>
  <button onclick="openDemo()">Demo</button>
</div>

<div class="main">

  <div class="header">
    <h1>Blueprint System</h1>
    <button class="btn-gold" onclick="connectWhatsApp()">Conectar WhatsApp</button>
  </div>

  <div class="dashboard">

    <!-- LEADS -->
    <div class="leads" id="leads"></div>

    <!-- CHAT -->
    <div class="chat">
      <div class="messages" id="messages"></div>
      <div class="typing" id="typing"></div>

      <div class="input-area">
        <input id="input" placeholder="Escribe mensaje..." />
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

  </div>

</div>

<script>
let leadsData = [
  {id:1,name:"Juan",unread:2},
  {id:2,name:"Maria",unread:0},
  {id:3,name:"Carlos",unread:5}
];

let activeLead = null;

function loadLeads(){
  const container = document.getElementById("leads");
  container.innerHTML = "";

  leadsData.forEach(l=>{
    const div = document.createElement("div");
    div.className = "lead";
    div.innerHTML = l.name + (l.unread ? ` <span class="badge">${l.unread}</span>`:"");

    div.onclick = ()=>{
      activeLead = l;
      document.querySelectorAll(".lead").forEach(e=>e.classList.remove("active"));
      div.classList.add("active");
      loadMessages();
    };

    container.appendChild(div);
  });
}

function loadMessages(){
  const messages = document.getElementById("messages");
  messages.innerHTML = "";

  messages.innerHTML += `<div class="message bot">Hola ${activeLead.name}, ¿en qué puedo ayudarte?</div>`;
}

function sendMessage(){
  const input = document.getElementById("input");
  const msg = input.value;
  if(!msg) return;

  const messages = document.getElementById("messages");

  messages.innerHTML += `<div class="message">Tú: ${msg}</div>`;

  input.value = "";

  showTyping();

  setTimeout(()=>{
    hideTyping();
    messages.innerHTML += `<div class="message bot">Procesando... te ayudo ahora.</div>`;
  },1500);
}

function showTyping(){
  document.getElementById("typing").innerText = "URUS está escribiendo...";
}

function hideTyping(){
  document.getElementById("typing").innerText = "";
}

function openDemo(){
  window.open("https://urus-backend-production.up.railway.app/landing.html","_blank");
}

function connectWhatsApp(){
  alert("Conectando WhatsApp...");
}

function showDashboard(){
  location.reload();
}

loadLeads();
</script>

</body>
</html>
