<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>URUS Blueprint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/blueprint/styles.css" />
</head>

<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <h1>URUS Blueprint</h1>
          <p>WhatsApp Growth OS</p>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active">Dashboard</button>
        <button class="nav-item">Leads</button>
        <button class="nav-item">Follow-ups</button>
        <button class="nav-item">Calendario</button>
        <button class="nav-item">Plantillas</button>
        <button class="nav-item">Analytics</button>
      </nav>
    </aside>

    <!-- 🔥 AQUÍ SE RENDERIZA TODO -->
    <main id="app" class="main-content"></main>
  </div>
<div id="metaModal" class="modal hidden">
  <div class="modal-content">
    <h3>Conectar WhatsApp Business</h3>

    <input id="metaPhoneInput" placeholder="+1 305 592 3928" />
    <input id="metaBusinessInput" placeholder="Nombre del negocio" />

    <div class="modal-actions">
      <button id="closeMetaModal">Cancelar</button>
      <button id="confirmMetaBtn" class="btn-primary">
        Continuar con Meta
      </button>
    </div>
  </div>
</div>
  
  
  <script src="/blueprint/app.js"></script>
</body>
</html>
