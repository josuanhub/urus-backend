<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URUS Blueprint OS</title>

  <link rel="stylesheet" href="/blueprint/styles.css"/>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

  <!-- ========================= -->
  <!-- SIDEBAR -->
  <!-- ========================= -->
  <aside class="sidebar">

    <div class="logo">
      <span class="logo-icon">⚡</span>
      <span>URUS OS</span>
    </div>

    <div class="nav">

      <div class="nav-item active" data-view="dashboard">
        <span>📊</span> Dashboard
      </div>

      <div class="nav-item" data-view="leads">
        <span>💬</span> Conversaciones
      </div>

      <div class="nav-item" data-view="followups">
        <span>🎯</span> Follow-ups
      </div>

      <div class="nav-item" data-view="calendar">
        <span>📅</span> Agenda
      </div>

      <div class="nav-item" data-view="analytics">
        <span>💰</span> Pipeline
      </div>

    </div>

    <div class="sidebar-footer">
      <div class="status">
        🟢 WhatsApp conectado
      </div>

      <div class="phone">
        +1 260 300 6906
      </div>
    </div>

  </aside>

  <!-- ========================= -->
  <!-- MAIN -->
  <!-- ========================= -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <p id="viewSubtitle">Sistema de conversión en tiempo real</p>
      </div>

      <div class="top-actions">
        <button id="refreshBtn">Actualizar</button>
      </div>

    </div>

    <!-- CONTENT -->
    <div id="appContent" class="content"></div>

  </main>

</div>

<!-- MOBILE NAV -->
<div class="mobile-nav">

  <button data-view="dashboard">📊</button>
  <button data-view="leads">💬</button>
  <button data-view="followups">🎯</button>
  <button data-view="calendar">📅</button>

</div>

<script src="/blueprint/app.js"></script>

</body>
</html>
